name: Compilar os PDFs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar trabalho e termo avulso
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            main.tex
            termo-autoria-ia.tex
          latexmk_use_lualatex: false
          args: -xelatex -interaction=nonstopmode -file-line-error
          extra_system_packages: ""

      - name: Publicar os PDFs como artefato
        uses: actions/upload-artifact@v4
        with:
          name: main-pdf
          path: |
            main.pdf
            termo-autoria-ia.pdf
